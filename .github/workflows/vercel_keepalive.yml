name: Keepalive (Frontend + Backend)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Frontend (Vercel)
        run: |
          curl -s https://sir-project-tracker.vercel.app > /dev/null

      - name: Ping Backend (Render)
        run: |
          curl -s https://sir-project-tracker.onrender.com/projects > /dev/null
